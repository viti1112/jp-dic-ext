name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      # EDRDG's FTP mirror is a small academic server that intermittently
      # times out or rate-limits CI traffic (seen repeatedly from GitHub
      # Actions' IP ranges) - caching the raw XML means most runs reuse a
      # previously-fetched copy instead of depending on that server being up
      # right now. The key rotates monthly so this isn't stuck on a stale
      # file forever, with no `restore-keys` fallback to an older month: a
      # too-old JMdict is still a real file the pipeline can build and test
      # against, but silently falling back to one from months ago would mask
      # this cache ever going stale rather than just re-fetching.
      - id: jmdict-cache-key
        run: echo "key=jmdict-raw-$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: data/raw/JMdict_e
          key: ${{ steps.jmdict-cache-key.outputs.key }}
      # The real dictionary isn't committed (see CLAUDE.md): npm run test
      # itself doesn't need it (every utils/dictionary/*.test.ts seeds a
      # tiny fixture instead), but npm run compile does - entrypoints/
      # background.ts calls browser.runtime.getURL('/dictionary/jmdict-en.json'),
      # and WXT only generates a PublicPath type covering that literal once
      # the file actually exists under public/ and `wxt prepare` has re-run
      # (confirmed locally: compile fails with a PublicPath type error
      # without this step, even though nothing in the test suite itself
      # touches the file).
      - name: Fetch JMdict and build the dictionary
        run: |
          [ -f data/raw/JMdict_e ] || npm run fetch:dictionary
          npm run build:dictionary
          npx wxt prepare
      - run: npm run compile
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - id: jmdict-cache-key
        run: echo "key=jmdict-raw-$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: data/raw/JMdict_e
          key: ${{ steps.jmdict-cache-key.outputs.key }}
      - name: Fetch JMdict and build the dictionary
        run: |
          [ -f data/raw/JMdict_e ] || npm run fetch:dictionary
          npm run build:dictionary
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: chrome-mv3
          path: .output/chrome-mv3
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: chrome-mv3
          path: .output/chrome-mv3
      # Loading an unpacked MV3 extension needs a real Chromium, not jsdom -
      # this is the one job that exercises the actual service-worker
      # lifecycle (cold start, message registration) a unit test can't see.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
